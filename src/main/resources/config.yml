settings:
  prefix: "&cPunishments &7┃ "

book:
  title: "Punishments"
  author: "PunishmentsBook"
  color: "black"
  hover: "Click to apply punishment"

punishments:

  hacking:
    name: "Hacking"
    type: "JAIL"
    duration: "3 days"
    reason: "Using hacks"
    command: "jail %player% 3d Using hacks"

  spamming:
    name: "Spamming"
    type: "MUTE"
    duration: "3 hours"
    reason: "Chat Spam"
    command: "mute %player% %duration% %reason%"

  swearing:
    name: "Swearing"
    type: "MUTE"
    duration: "7 hours"
    reason: "Swearing"
    command: "mute %player% %duration% %reason%"

  disrespect:
    name: "Disrespect"
    type: "MUTE"
    duration: "4 hours"
    reason: "Disrespect"
    command: "mute %player% %duration% %reason%"

  advertising:
    name: "Advertising"
    type: "MUTE"
    duration: "14 days"
    reason: "Advertising"
    command: "mute %player% %duration% %reason%"

  voice:
    name: "Voice"
    type: "BAN"
    duration: "4 days"
    reason: "Voice violation"
    command: "ban %player% %duration% %reason%"

  flooding:
    name: "Flooding"
    type: "IP-BAN"
    duration: "18 days"
    reason: "Flooding"
    command: "banip %player% %reason%"

revoke:

  jail-command: "unjail %player%"

  mute-command: "unmute %player%"

  ban-command: "pardon %player%"

  ip-ban-command: "pardon-ip %ip%"

  messages:

    no-permission: "&cYou don't have permission to revoke punishments."

    no-punishment: "&cThis player has no active punishment."

    success: "&aPunishment &f%punishment% &afor &f%player% &ahas been revoked."

    target: "&aYour punishment has been revoked by &f%staff%&a."

messages:

  errors:

    no-permission: "&cYou don't have permission."

    unknown-punishment: "&cUnknown punishment."

    player-not-online: "&cPlayer must be online."

    command-failed: "&cPunishment command failed."

  muted: "&cYou are currently muted."

  staff:

    applied: "&aPunishment applied successfully."

    player: "&7Player: &f%player%"

    punishment: "&7Punishment: &f%punishment%"

    type: "&7Type: &f%type%"

    duration: "&7Duration: &f%duration%"

    reason: "&7Reason: &f%reason%"

    staff: "&7Staff: &f%staff%"

  target:

    applied: "&cYou have been punished."

    player: "&7Player: &f%player%"

    punishment: "&7Punishment: &f%punishment%"

    type: "&7Type: &f%type%"

    duration: "&7Duration: &f%duration%"

    reason: "&7Reason: &f%reason%"

    staff: "&7Staff: &f%staff%"
