settings:
  prefix: "&cPunishments &7┃ "

book:
  title: "Punishments"
  author: "PunishmentsBook"
  color: "black"
  hover: "Click to apply punishment"

rank-priority:
  enabled: true

  groups:
    owner: 90
    manager: 80
    supervisor: 70
    helper: 60
    builder: 50
    vip: 40
    default: 10

  messages:
    higher-rank: "&cYou cannot punish a staff member with a higher rank!"
    same-rank: "&cYou cannot punish a staff member with the same rank!"
    unknown-rank: "&cCould not determine your rank or the target's rank."

punishments:

  hacking:
    name: "Hacking"
    type: "JAIL"
    duration: "3 days"
    reason: "Using hacks"
    command: "jail %player% 3d Using hacks"

  spamming:
    name: "Spamming"
    type: "MUTE"
    duration: "3 hours"
    reason: "Chat Spam"

  swearing:
    name: "Swearing"
    type: "MUTE"
    duration: "7 hours"
    reason: "Swearing"

  disrespect:
    name: "Disrespect"
    type: "MUTE"
    duration: "4 hours"
    reason: "Disrespect"

  advertising:
    name: "Advertising"
    type: "MUTE"
    duration: "14 days"
    reason: "Advertising"

  voice:
    name: "Voice"
    type: "BAN"
    duration: "4 days"
    reason: "Voice violation"

  flooding:
    name: "Flooding"
    type: "IP-BAN"
    duration: "18 days"
    reason: "Flooding"

revoke:

  jail:
    enabled: true
    command: "unjail %player%"

  mute:
    enabled: true

  ban:
    enabled: true

  ip-ban:
    enabled: true

  messages:
    no-permission: "&cYou don't have permission to revoke punishments."
    no-punishment: "&cThis player has no active punishment."
    success: "&aPunishment &f%punishment% &afor &f%player% &ahas been revoked."
    target: "&aYour punishment has been revoked by &f%staff%&a."

messages:

  errors:
    no-permission: "&cYou don't have permission."
    unknown-punishment: "&cUnknown punishment."
    player-not-online: "&cPlayer must be online."
    command-failed: "&cPunishment command failed."
    players-only: "&cOnly players can use this command."

  muted:
    message: "&cYou are currently muted."
    reason: "&7Reason: &f%reason%"
    duration: "&7Duration: &f%duration%"
    staff: "&7Staff: &f%staff%"

  banned:
    message: "&cYou are banned."
    punishment: "&7Punishment: &f%punishment%"
    reason: "&7Reason: &f%reason%"
    duration: "&7Duration: &f%duration%"
    staff: "&7Staff: &f%staff%"

  ip-banned:
    message: "&cYour IP is banned."
    punishment: "&7Punishment: &f%punishment%"
    reason: "&7Reason: &f%reason%"
    duration: "&7Duration: &f%duration%"
    staff: "&7Staff: &f%staff%"

  staff:
    applied: "&aPunishment applied successfully."
    player: "&7Player: &f%player%"
    punishment: "&7Punishment: &f%punishment%"
    type: "&7Type: &f%type%"
    duration: "&7Duration: &f%duration%"
    reason: "&7Reason: &f%reason%"
    staff: "&7Staff: &f%staff%"

  target:
    applied: "&cYou have been punished."
    player: "&7Player: &f%player%"
    punishment: "&7Punishment: &f%punishment%"
    type: "&7Type: &f%type%"
    duration: "&7Duration: &f%duration%"
    reason: "&7Reason: &f%reason%"
    staff: "&7Staff: &f%staff%"
