name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: Flynexx

commands:
  pm:
    description: Open punishment book
    usage: /pm <player>

  pmapply:
    description: Apply punishment
    usage: /pmapply <player> <punishment>

  pmrevoke:
    description: Revoke punishment
    usage: /pmrevoke <player>

permissions:

  punishmentsbook.use:
    description: Use the punishment book
    default: op

  punishmentsbook.revoke:
    description: Revoke punishments
    default: op

  # Rank priority permissions
  # Higher number = higher rank

  punishmentsbook.rank.90:
    description: Owner rank
    default: false

  punishmentsbook.rank.80:
    description: Manager rank
    default: false

  punishmentsbook.rank.70:
    description: Supervisor rank
    default: false

  punishmentsbook.rank.60:
    description: Helper rank
    default: false

  punishmentsbook.rank.50:
    description: Builder rank
    default: false

  punishmentsbook.rank.40:
    description: VIP rank
    default: false

  punishmentsbook.rank.10:
    description: Default rank
    default: false
