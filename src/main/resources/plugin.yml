name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx
description: Clickable punishment book for Spigot 1.8.8

commands:
  pm:
    description: Opens the punishment book
    usage: /pm <player>
    permission: punishmentsbook.use

  pmapply:
    description: Executes a punishment
    usage: /pmapply <player> <punishment>
    permission: punishmentsbook.use

permissions:
  punishmentsbook.use:
    description: Allows the player to use PunishmentsBook
    default: op
