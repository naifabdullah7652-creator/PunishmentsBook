name: PunishmentsBook
version: 3.1.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx
description: Independent Punishment System

commands:
  pm:
    description: Open the punishment book
    usage: /pm <player>

  pmapply:
    description: Apply a punishment
    usage: /pmapply <player> <punishment>

permissions:
  punishmentsbook.use:
    description: Use PunishmentsBook
    default: op
