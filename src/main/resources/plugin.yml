name: PunishmentsBook
version: 3.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx
description: Independent Punishment System

commands:
  pm:
    description: Open the punishment book
    usage: /pm <player>

  pmdetails:
    description: Open punishment details
    usage: /pmdetails <player> <punishment>

  pmapply:
    description: Apply a punishment
    usage: /pmapply <player> <punishment>

  pmsetjail:
    description: Set the jail location
    usage: /pmsetjail

permissions:
  punishmentsbook.use:
    description: Use PunishmentsBook
    default: op

  punishmentsbook.setjail:
    description: Set the jail location
    default: op
