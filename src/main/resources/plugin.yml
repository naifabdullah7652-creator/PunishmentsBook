name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx

commands:
  pm:
    description: Open the punishments book
    usage: /pm <player>
    permission: punishmentsbook.use

  pmapply:
    description: Apply a punishment
    usage: /pmapply <player> <punishment>
    permission: punishmentsbook.use

  pmrevoke:
    description: Revoke an active punishment
    usage: /pmrevoke <player>
    permission: punishmentsbook.revoke

permissions:
  punishmentsbook.use:
    default: op

  punishmentsbook.revoke:
    default: op
