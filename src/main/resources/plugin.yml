name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx
description: Punishment book for Minecraft 1.8.8

commands:
  pm:
    description: Opens the punishment book
    usage: /pm <player>

  pmapply:
    description: Executes a punishment
    usage: /pmapply <player> <punishment>

permissions:
  punishmentsbook.use:
    default: op
