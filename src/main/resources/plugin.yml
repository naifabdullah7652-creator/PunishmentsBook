name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: Flynexx

commands:
  pm:
    description: Open the punishment book
    usage: /pm <player>

  pmapply:
    description: Apply a punishment
    usage: /pmapply <player> <punishment>

  pmrevoke:
    description: Revoke a punishment
    usage: /pmrevoke <player>

permissions:

  punishmentsbook.use:
    description: Allows the player to use the punishment book
    default: op

  punishmentsbook.revoke:
    description: Allows the player to revoke punishments
    default: op

  punishmentsbook.rank.90:
    description: Owner rank priority 90
    default: false

  punishmentsbook.rank.80:
    description: Manager rank priority 80
    default: false

  punishmentsbook.rank.70:
    description: Supervisor rank priority 70
    default: false

  punishmentsbook.rank.60:
    description: Helper rank priority 60
    default: false

  punishmentsbook.rank.50:
    description: Builder rank priority 50
    default: false

  punishmentsbook.rank.40:
    description: VIP rank priority 40
    default: false

  punishmentsbook.rank.10:
    description: Default rank priority 10
    default: false

  punishmentsbook.rank.bypass:
    description: Allows punishment regardless of target rank
    default: false
