commands:
  pm:
    description: Open the punishment book
    usage: /pm <player>

  pmdetails:
    description: Open punishment details
    usage: /pmdetails <player> <punishment>

  pmapply:
    description: Apply punishment
    usage: /pmapply <player> <punishment>

  pmsetjail:
    description: Set jail location
    usage: /pmsetjail

permissions:
  punishmentsbook.use:
    default: op

  punishmentsbook.setjail:
    default: op
