name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx

commands:
  pm:
    description: Give the punishment book
    usage: /pm <player>

  pmapply:
    description: Execute a punishment from the punishment book
    usage: /pmapply <player> <punishment>

permissions:
  punishmentsbook.use:
    default: op
