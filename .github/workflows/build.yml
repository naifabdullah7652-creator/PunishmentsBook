name: Build PunishmentsBook

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn clean package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PunishmentsBook-2.0.0
          path: target/PunishmentsBook-2.0.0.jar
