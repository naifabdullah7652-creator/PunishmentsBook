name: PunishmentsBook
version: 2.0.0
main: com.flynexx.punishments.PunishmentsBook
author: FlyNeXx
description: Punishment management system for Minecraft 1.8.8

depend:
  - ProtocolLib

commands:
  pm:
    description: Opens the punishment menu
    usage: /pm <player>
    permission: punishmentsbook.use

  pmapply:
    description: Executes a punishment
    usage: /pmapply <player> <punishment>
    permission: punishmentsbook.use

permissions:
  punishmentsbook.use:
    description: Allows using PunishmentsBook
    default: op
