name: Build PunishmentsBook

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Clean Maven cache
        run: rm -rf ~/.m2/repository/net/md-5

      - name: Build
        run: mvn -U -B clean package -Dfile.encoding=UTF-8

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PunishmentsBook-2.0.0
          path: target/PunishmentsBook-2.0.0.jar
